# =============================================================================
# AUTOMATIONS
# =============================================================================
# Each automation checks its toggle in input_boolean before running.
# Enable/disable automations via Settings > Helpers or your dashboard.
# =============================================================================

# -----------------------------------------------------------------------------
# Presence Auto Lights (Blueprint-based)
# Uses custom/presence_auto_lights blueprint
# -----------------------------------------------------------------------------
- id: kitchen_auto_lights
  alias: Kitchen Auto Lights
  description: Turn on/off kitchen lights based on presence
  use_blueprint:
    path: custom/presence_auto_lights.yaml
    input:
      presence_sensor: binary_sensor.s1_pro_multi_sense_614680_any_presence
      light_target:
        entity_id: light.kitchen
      toggle_entity: input_boolean.kitchen_auto_lights
      countdown_timer: timer.kitchen_light_off
      no_presence_wait: 1
      turn_on_transition: 1
      turn_off_transition: 3

- id: office_auto_lights
  alias: Office Auto Lights
  description: Turn on/off office lights based on presence
  use_blueprint:
    path: custom/presence_auto_lights.yaml
    input:
      presence_sensor: binary_sensor.s1_pro_multi_sense_98a998_any_presence
      light_target:
        entity_id: light.office
      toggle_entity: input_boolean.office_auto_lights
      countdown_timer: timer.office_light_off
      no_presence_wait: 1
      turn_on_transition: 1
      turn_off_transition: 3

- id: palace_auto_lights
  alias: Palace Auto Lights
  description: Turn on/off palace lights based on presence
  use_blueprint:
    path: custom/presence_auto_lights.yaml
    input:
      presence_sensor: binary_sensor.s1_pro_multi_sense_98a968_any_presence
      light_target:
        entity_id: light.palace
      toggle_entity: input_boolean.palace_auto_lights
      countdown_timer: timer.palace_light_off
      no_presence_wait: 1
      turn_on_transition: 1
      turn_off_transition: 3

- id: bedroom_auto_lights
  alias: Bedroom Auto Lights
  description: Turn on/off bedroom lights based on presence (until 10pm)
  use_blueprint:
    path: custom/presence_auto_lights.yaml
    input:
      presence_sensor: binary_sensor.s1_pro_multi_sense_96e7b0_any_presence
      light_target:
        entity_id: light.bedroom
      toggle_entity: input_boolean.bedroom_auto_lights
      countdown_timer: timer.bedroom_light_off
      no_presence_wait: 1
      turn_on_transition: 1
      turn_off_transition: 5
      max_brightness: 70
      color_temp: 2700
      time_limit_before: "22:00:00"

# -----------------------------------------------------------------------------
# Arrived Home Trackers (Blueprint-based)
# Uses custom/arrived_home_tracker blueprint
# -----------------------------------------------------------------------------
- id: leo_arrived_home_tracker
  alias: Leo Arrived Home Tracker
  description: Record timestamp when Leo arrives home
  use_blueprint:
    path: custom/arrived_home_tracker.yaml
    input:
      person_entity: person.leo
      datetime_entity: input_datetime.leo_arrived_home
      toggle_entity: input_boolean.presence_tracking

- id: kardi_arrived_home_tracker
  alias: Kardi Arrived Home Tracker
  description: Record timestamp when Kardi arrives home
  use_blueprint:
    path: custom/arrived_home_tracker.yaml
    input:
      person_entity: person.kardi
      datetime_entity: input_datetime.kardi_arrived_home
      toggle_entity: input_boolean.presence_tracking

# -----------------------------------------------------------------------------
# Laundry Notifications (Blueprint-based)
# Uses custom/appliance_done_notification blueprint
# -----------------------------------------------------------------------------
- id: laundry_washer_done
  alias: Laundry - Washer Finished
  description: Notify when washing machine cycle completes
  use_blueprint:
    path: custom/appliance_done_notification.yaml
    input:
      running_sensor: binary_sensor.washing_machine_running
      toggle_entity: input_boolean.laundry_notifications
      notify_service: notify.mobile_app_leos_iphone
      notification_title: "Laundry Done!"
      notification_message: "The washing machine has finished. Don't forget to move clothes to dryer!"
      notification_tag: laundry_washer
      wait_after_off: 2

- id: laundry_dryer_done
  alias: Laundry - Dryer Finished
  description: Notify when dryer cycle completes
  use_blueprint:
    path: custom/appliance_done_notification.yaml
    input:
      running_sensor: binary_sensor.dryer_running
      toggle_entity: input_boolean.laundry_notifications
      notify_service: notify.mobile_app_leos_iphone
      notification_title: "Dryer Done!"
      notification_message: "The dryer has finished. Time to fold!"
      notification_tag: laundry_dryer
      wait_after_off: 2

# -----------------------------------------------------------------------------
# Vacuum Automation
# Uses existing Dreame Z60 Ultra
# No toggle (manual trigger only)
# -----------------------------------------------------------------------------
- id: clean_after_knaak_toilet
  alias: Clean after Knaak Toilet
  description: Cleans his mess
  triggers: []
  conditions: []
  actions:
    - sequence:
        - action: select.select_option
          data:
            option: sweeping
          target:
            entity_id: select.z60_ultra_roller_complete_cleaning_mode
        - action: dreame_vacuum.vacuum_clean_segment
          data:
            segments: 3
          target:
            entity_id: vacuum.z60_ultra_roller_complete
  mode: single

# -----------------------------------------------------------------------------
# Adaptive Lighting
# Uses existing light.living_room
# Toggle: input_boolean.adaptive_lighting
# -----------------------------------------------------------------------------
- id: adaptive_lighting_morning
  alias: Adaptive Lighting - Morning Warm Up
  description: Gradually increase brightness and color temperature in the morning
  triggers:
    - trigger: time
      at: "06:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.adaptive_lighting
      state: "on"
    - condition: template
      value_template: >
        {% set offset = states('input_number.sunrise_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float < elevation_threshold }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 30
        kelvin: 2700
    - delay: "00:30:00"
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 70
        kelvin: 4000
  mode: single

- id: adaptive_lighting_evening
  alias: Adaptive Lighting - Evening Wind Down
  description: Dim lights and warm color temperature in the evening
  triggers:
    - trigger: time
      at: "20:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.adaptive_lighting
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 50
        kelvin: 2700
        transition: 1800
  mode: single

- id: adaptive_lighting_night
  alias: Adaptive Lighting - Night Mode
  description: Very dim warm lights at night
  triggers:
    - trigger: time
      at: "22:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.adaptive_lighting
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 20
        kelvin: 2200
        transition: 900
  mode: single

# -----------------------------------------------------------------------------
# Welcome Home
# Toggle: input_boolean.welcome_home_lights (default: off)
# -----------------------------------------------------------------------------
- id: welcome_home_lights
  alias: Welcome Home - Lights On
  description: Turn on living room lights when someone arrives home after sunset
  triggers:
    - trigger: state
      entity_id:
        - person.leo
        - person.kardi
      from: not_home
      to: home
  conditions:
    - condition: state
      entity_id: input_boolean.welcome_home_lights
      state: "on"
    - condition: template
      value_template: >
        {% set offset = states('input_number.sunset_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float < elevation_threshold }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: "{{ states('sensor.time_aware_brightness') | int }}"
        kelvin: 3000
  mode: single

# -----------------------------------------------------------------------------
# Goodbye - All Off
# Toggle: input_boolean.goodbye_all_off (default: off)
# -----------------------------------------------------------------------------
- id: goodbye_all_off
  alias: Goodbye - All Off
  description: Turn off all lights and close blinds when everyone leaves home
  triggers:
    - trigger: state
      entity_id: zone.home
      to: "0"
      for:
        minutes: 5
  conditions:
    - condition: state
      entity_id: input_boolean.goodbye_all_off
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.living_room
          - light.kitchen
          - light.office
          - light.bedroom
          - light.bathroom
          - light.palace
          - light.attic
          - light.staircase
    - action: cover.close_cover
      target:
        entity_id:
          - cover.rs100_solar_io_attic
          - cover.rs100_solar_io_bathroom
          - cover.rs100_solar_io_bedroom
          - cover.rs100_solar_io_office
          - cover.rs100_solar_io_palace
  mode: single

# -----------------------------------------------------------------------------
# Morning Blinds
# Toggle: input_boolean.morning_blinds (default: off)
# -----------------------------------------------------------------------------
- id: morning_blinds_open
  alias: Morning - Open Blinds
  description: Open all blinds at sunrise on weekdays
  triggers:
    - trigger: template
      value_template: >
        {% set offset = states('input_number.sunrise_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float >= elevation_threshold and state_attr('sun.sun', 'rising') }}
  conditions:
    - condition: state
      entity_id: input_boolean.morning_blinds
      state: "on"
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
  actions:
    - action: cover.open_cover
      target:
        entity_id:
          - cover.rs100_solar_io_attic
          - cover.rs100_solar_io_bathroom
          - cover.rs100_solar_io_bedroom
          - cover.rs100_solar_io_office
          - cover.rs100_solar_io_palace
          - cover.sunea40_solar_io_kitchen
  mode: single

# -----------------------------------------------------------------------------
# Evening Blinds
# Toggle: input_boolean.evening_blinds (default: off)
# -----------------------------------------------------------------------------
- id: evening_blinds_close
  alias: Evening - Close Blinds
  description: Close all blinds at 9pm
  triggers:
    - trigger: time
      at: "21:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.evening_blinds
      state: "on"
  actions:
    - action: cover.close_cover
      target:
        entity_id:
          - cover.rs100_solar_io_attic
          # - cover.rs100_solar_io_bathroom
          - cover.rs100_solar_io_bedroom
          - cover.rs100_solar_io_office
          # - cover.rs100_solar_io_palace
  mode: single

# -----------------------------------------------------------------------------
# Daily Vacuum When Away
# Toggle: input_boolean.daily_vacuum (default: off)
# -----------------------------------------------------------------------------
- id: daily_vacuum_when_away
  alias: Daily Vacuum When Away
  description: Start vacuum cleaning when everyone leaves and it hasn't cleaned today
  triggers:
    - trigger: state
      entity_id: zone.home
      to: "0"
      for:
        minutes: 10
  conditions:
    - condition: state
      entity_id: input_boolean.daily_vacuum
      state: "on"
    - condition: time
      after: "09:00:00"
      before: "18:00:00"
    - condition: template
      value_template: >
        {{ (as_timestamp(now()) - as_timestamp(states('sensor.z60_ultra_roller_complete_last_clean_begin') | default(0))) > 86400 }}
  actions:
    - action: vacuum.start
      target:
        entity_id: vacuum.z60_ultra_roller_complete
  mode: single

# -----------------------------------------------------------------------------
# Vacuum Error Notification
# Toggle: input_boolean.vacuum_notifications (default: off)
# -----------------------------------------------------------------------------
- id: vacuum_error_notification
  alias: Vacuum Error Notification
  description: Notify when vacuum encounters an error
  triggers:
    - trigger: template
      value_template: "{{ states('sensor.z60_ultra_roller_complete_error') != 'no_error' }}"
    - trigger: template
      value_template: "{{ states('sensor.roborock_s7_maxv_vacuum_error') != 'none' }}"
  conditions:
    - condition: state
      entity_id: input_boolean.vacuum_notifications
      state: "on"
  actions:
    - action: notify.mobile_app_leos_iphone
      data:
        title: Vacuum Error
        message: >
          {% if states('sensor.z60_ultra_roller_complete_error') != 'no_error' %}
          Truus: {{ states('sensor.z60_ultra_roller_complete_error') }}
          {% else %}
          Roborock: {{ states('sensor.roborock_s7_maxv_vacuum_error') }}
          {% endif %}
        data:
          tag: vacuum_error
  mode: single

# -----------------------------------------------------------------------------
# Vacuum Maintenance Reminder
# Toggle: input_boolean.vacuum_notifications (default: off)
# -----------------------------------------------------------------------------
- id: vacuum_maintenance_reminder
  alias: Vacuum Maintenance Reminder
  description: Remind to clean vacuum sensors when they need attention
  triggers:
    - trigger: numeric_state
      entity_id: sensor.z60_ultra_roller_complete_sensor_dirty_left
      below: 20
    - trigger: numeric_state
      entity_id: sensor.z60_ultra_roller_complete_filter_left
      below: 20
    - trigger: numeric_state
      entity_id: sensor.z60_ultra_roller_complete_side_brush_left
      below: 20
    - trigger: numeric_state
      entity_id: sensor.z60_ultra_roller_complete_main_brush_left
      below: 20
  conditions:
    - condition: state
      entity_id: input_boolean.vacuum_notifications
      state: "on"
  actions:
    - action: notify.mobile_app_leos_iphone
      data:
        title: Vacuum Maintenance
        message: >
          Truus needs attention:
          {% if states('sensor.z60_ultra_roller_complete_sensor_dirty_left') | int < 20 %}Sensors: {{ states('sensor.z60_ultra_roller_complete_sensor_dirty_left') }}% left{% endif %}
          {% if states('sensor.z60_ultra_roller_complete_filter_left') | int < 20 %}Filter: {{ states('sensor.z60_ultra_roller_complete_filter_left') }}% left{% endif %}
          {% if states('sensor.z60_ultra_roller_complete_side_brush_left') | int < 20 %}Side brush: {{ states('sensor.z60_ultra_roller_complete_side_brush_left') }}% left{% endif %}
          {% if states('sensor.z60_ultra_roller_complete_main_brush_left') | int < 20 %}Main brush: {{ states('sensor.z60_ultra_roller_complete_main_brush_left') }}% left{% endif %}
        data:
          tag: vacuum_maintenance
  mode: single

# -----------------------------------------------------------------------------
# TV Movie Mode
# Toggle: input_boolean.tv_movie_mode (default: off)
# -----------------------------------------------------------------------------
- id: tv_movie_mode
  alias: TV Movie Mode
  description: Dim living room lights when TV starts playing
  triggers:
    - trigger: state
      entity_id: media_player.livingroom_tv
      to: playing
  conditions:
    - condition: state
      entity_id: input_boolean.tv_movie_mode
      state: "on"
    - condition: state
      entity_id: light.living_room
      state: "on"
    - condition: template
      value_template: >
        {% set offset = states('input_number.sunset_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float < elevation_threshold }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 15
        kelvin: 2200
        transition: 3
  mode: single

- id: tv_pause_brighten
  alias: TV Pause - Brighten Lights
  description: Brighten living room lights when TV pauses or stops
  triggers:
    - trigger: state
      entity_id: media_player.livingroom_tv
      from: playing
      to:
        - paused
        - idle
        - "off"
  conditions:
    - condition: state
      entity_id: input_boolean.tv_movie_mode
      state: "on"
    - condition: state
      entity_id: light.living_room
      state: "on"
    - condition: template
      value_template: >
        {% set offset = states('input_number.sunset_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float < elevation_threshold }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 60
        kelvin: 3000
        transition: 2
  mode: single

# -----------------------------------------------------------------------------
# Outdoor Lights
# Toggle: input_boolean.outdoor_lights (default: off)
# -----------------------------------------------------------------------------
- id: outdoor_lights_sunset
  alias: Outdoor Lights - Sunset
  description: Turn on outdoor lights at sunset
  triggers:
    - trigger: template
      value_template: >
        {% set offset = states('input_number.sunset_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float <= elevation_threshold and not state_attr('sun.sun', 'rising') }}
  conditions:
    - condition: state
      entity_id: input_boolean.outdoor_lights
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id:
          - light.hue_resonate_outdoor_wall_1
          - light.hue_resonate_outdoor_wall_2
      data:
        brightness_pct: 80
  mode: single

- id: outdoor_lights_off_night
  alias: Outdoor Lights - Off at Night
  description: Turn off outdoor lights late at night
  triggers:
    - trigger: time
      at: "23:30:00"
  conditions:
    - condition: state
      entity_id: input_boolean.outdoor_lights
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.hue_resonate_outdoor_wall_1
          - light.hue_resonate_outdoor_wall_2
  mode: single

# -----------------------------------------------------------------------------
# Phone Battery Alert
# Toggle: input_boolean.phone_battery_alert (default: off)
# -----------------------------------------------------------------------------
- id: low_phone_battery_alert
  alias: Low Phone Battery Alert
  description: Notify when phone battery is low and not charging
  triggers:
    - trigger: numeric_state
      entity_id: sensor.leos_iphone_battery_level
      below: 20
  conditions:
    - condition: state
      entity_id: input_boolean.phone_battery_alert
      state: "on"
    - condition: state
      entity_id: sensor.leos_iphone_battery_state
      state: Not Charging
  actions:
    - action: notify.mobile_app_leos_iphone
      data:
        title: Low Battery
        message: "Your iPhone battery is at {{ states('sensor.leos_iphone_battery_level') }}%"
        data:
          tag: low_battery
  mode: single

# -----------------------------------------------------------------------------
# Staircase Transitional Light
# Toggle: input_boolean.staircase_transitional_light (default: off)
# -----------------------------------------------------------------------------
- id: staircase_transitional_light
  alias: Staircase Transitional Light
  description: Turn on staircase light briefly when transitioning between floors
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.s1_pro_multi_sense_98a998_any_presence
        - binary_sensor.s1_pro_multi_sense_614680_any_presence
        - binary_sensor.s1_pro_multi_sense_96e7b0_any_presence
        - binary_sensor.s1_pro_multi_sense_98a968_any_presence
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.staircase_transitional_light
      state: "on"
    - condition: template
      value_template: >
        {% set offset = states('input_number.sunset_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float < elevation_threshold }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.staircase
      data:
        brightness_pct: "{{ states('sensor.office_ceiling_brightness') | int }}"
        kelvin: 2700
    - delay:
        minutes: 5
    - action: light.turn_off
      target:
        entity_id: light.staircase
      data:
        transition: 3
  mode: restart

# -----------------------------------------------------------------------------
# Office Ceiling Evening Dimming
# Dims the office ceiling light twice as fast as other office lights
# Toggle: input_boolean.office_auto_lights (uses same toggle as office auto lights)
# -----------------------------------------------------------------------------
- id: office_ceiling_evening_dimming
  alias: Office Ceiling Evening Dimming
  description: Dim office ceiling twice as fast as other office lights in the evening
  triggers:
    - trigger: state
      entity_id: sensor.office_ceiling_brightness
  conditions:
    - condition: state
      entity_id: input_boolean.office_auto_lights
      state: "on"
    - condition: state
      entity_id: light.officeceiling
      state: "on"
    - condition: time
      after: "17:00:00"
      before: "23:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.officeceiling
      data:
        brightness_pct: "{{ states('sensor.office_ceiling_brightness') | int }}"
        transition: 60
  mode: single
