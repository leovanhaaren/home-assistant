# Kitchen auto lights - uses S1 Pro Kitchen presence sensor
- id: kitchen_auto_lights_on
  alias: Kitchen auto lights on
  description: Turn on kitchen lights when presence detected after sunset
  triggers:
    - trigger: state
      entity_id: binary_sensor.s1_pro_multi_sense_614680_any_presence
      to: "on"
  conditions:
    - condition: sun
      after: sunset
      before: sunrise
  actions:
    - action: light.turn_on
      data:
        transition: 1
      target:
        entity_id: light.kitchen
  mode: single

- id: kitchen_auto_lights_off
  alias: Kitchen auto lights off
  description: Turn off kitchen lights when no presence detected
  triggers:
    - trigger: state
      entity_id: binary_sensor.s1_pro_multi_sense_614680_any_presence
      to: "off"
      for:
        minutes: 2
  conditions: []
  actions:
    - action: light.turn_off
      data:
        transition: 3
      target:
        entity_id: light.kitchen
  mode: single

# Office desk presence - uses S1 Pro Office presence sensor
- id: office_desk_presence_on
  alias: Office desk presence
  description: Turn on office lights when presence detected
  triggers:
    - trigger: state
      entity_id: binary_sensor.s1_pro_multi_sense_98a998_any_presence
      to: "on"
  conditions:
    - condition: sun
      before: sunrise
      after: sunset
      before_offset: "-02:00:00"
      after_offset: "-02:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.office
  mode: single

- id: office_desk_presence_off
  alias: Office desk no presence
  description: Turn off office lights when no presence
  triggers:
    - trigger: state
      entity_id: binary_sensor.s1_pro_multi_sense_98a998_any_presence
      to: "off"
      for:
        minutes: 5
  conditions: []
  actions:
    - action: light.turn_off
      target:
        entity_id: light.office
  mode: single

# Vacuum automation - uses existing Dreame Z60 Ultra
- id: clean_after_knaak_toilet
  alias: Clean after Knaak Toilet
  description: Cleans his mess
  triggers: []
  conditions: []
  actions:
    - sequence:
        - action: select.select_option
          data:
            option: sweeping
          target:
            entity_id: select.z60_ultra_roller_complete_cleaning_mode
        - action: dreame_vacuum.vacuum_clean_segment
          data:
            segments: 3
          target:
            entity_id: vacuum.z60_ultra_roller_complete
  mode: single

# Adaptive Lighting - uses existing light.living_room
- id: adaptive_lighting_morning
  alias: Adaptive Lighting - Morning Warm Up
  description: Gradually increase brightness and color temperature in the morning
  triggers:
    - trigger: time
      at: "06:00:00"
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 30
        kelvin: 2700
    - delay: "00:30:00"
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 70
        kelvin: 4000
  mode: single

- id: adaptive_lighting_evening
  alias: Adaptive Lighting - Evening Wind Down
  description: Dim lights and warm color temperature in the evening
  triggers:
    - trigger: time
      at: "20:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 50
        kelvin: 2700
        transition: 1800
  mode: single

- id: adaptive_lighting_night
  alias: Adaptive Lighting - Night Mode
  description: Very dim warm lights at night
  triggers:
    - trigger: time
      at: "22:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 20
        kelvin: 2200
        transition: 900
  mode: single

# Laundry notifications - uses existing washing machine and dryer sensors
- id: laundry_washer_done
  alias: Laundry - Washer Finished
  description: Notify when washing machine cycle completes
  triggers:
    - trigger: state
      entity_id: binary_sensor.washing_machine_running
      from: "on"
      to: "off"
      for:
        minutes: 2
  conditions: []
  actions:
    - action: notify.mobile_app_leos_iphone
      data:
        title: Laundry Done!
        message: The washing machine has finished. Don't forget to move clothes to dryer!
        data:
          tag: laundry_washer
          push:
            sound:
              name: default
              critical: 0
  mode: single

- id: laundry_dryer_done
  alias: Laundry - Dryer Finished
  description: Notify when dryer cycle completes
  triggers:
    - trigger: state
      entity_id: binary_sensor.dryer_running
      from: "on"
      to: "off"
      for:
        minutes: 2
  conditions: []
  actions:
    - action: notify.mobile_app_leos_iphone
      data:
        title: Dryer Done!
        message: The dryer has finished. Time to fold!
        data:
          tag: laundry_dryer
          push:
            sound:
              name: default
              critical: 0
  mode: single
