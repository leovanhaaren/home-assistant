# -----------------------------------------------------------------------------
# Phone Battery Alert
# Toggle: input_boolean.phone_battery_alert (default: off)
# -----------------------------------------------------------------------------
- id: low_phone_battery_alert
  alias: Low Phone Battery Alert
  description: Notify when phone battery is low and not charging
  triggers:
    - trigger: numeric_state
      entity_id: sensor.leos_iphone_battery_level
      below: 20
  conditions:
    - condition: state
      entity_id: input_boolean.phone_battery_alert
      state: "on"
    - condition: state
      entity_id: sensor.leos_iphone_battery_state
      state: Not Charging
  actions:
    - action: notify.mobile_app_leos_iphone
      data:
        title: Low Battery
        message: "Your iPhone battery is at {{ states('sensor.leos_iphone_battery_level') }}%"
        data:
          tag: low_battery
  mode: single

# -----------------------------------------------------------------------------
# Device Health
# Toggle: input_boolean.device_health_alerts (default: off)
# -----------------------------------------------------------------------------
- id: device_health_low_battery_alert
  alias: Device Health - Low Battery
  description: Notify when any battery entity drops to 20% or lower
  triggers:
    - trigger: event
      event_type: state_changed
  conditions:
    - condition: state
      entity_id: input_boolean.device_health_alerts
      state: "on"
    - condition: template
      value_template: >
        {% set entity_id = trigger.event.data.entity_id %}
        {% set new_state = trigger.event.data.new_state %}
        {% set old_state = trigger.event.data.old_state %}
        {% if entity_id in ['sensor.leos_iphone_battery_level'] or new_state is none %}
          false
        {% else %}
          {% set value = new_state.state %}
          {% set old_value = old_state.state if old_state is not none else none %}
          {% set has_battery_signature = 'battery' in entity_id or new_state.attributes.device_class == 'battery' %}
          {% set level = value | float(default=999) %}
          {% set old_level = old_value | float(default=999) if old_value is not none else 999 %}
          {{ has_battery_signature and value not in ['unknown', 'unavailable'] and level <= 20 and old_level > 20 }}
        {% endif %}
  actions:
    - variables:
        entity_id: "{{ trigger.event.data.entity_id }}"
        battery_level: "{{ trigger.event.data.new_state.state }}"
        battery_name: >
          {{ trigger.event.data.new_state.name if trigger.event.data.new_state is not none else trigger.event.data.entity_id }}
    - action: notify.mobile_app_leos_iphone
      data:
        title: "Device Health: Low Battery"
        message: "{{ battery_name }} is at {{ battery_level }}% battery."
        data:
          tag: "device_health_low_battery_{{ entity_id | replace('.', '_') }}"
  mode: queued
  max: 25

- id: device_health_unavailable_alert
  alias: Device Health - Device Unavailable
  description: Notify when a key device/entity is unavailable for 10 minutes
  triggers:
    - trigger: event
      event_type: state_changed
  conditions:
    - condition: state
      entity_id: input_boolean.device_health_alerts
      state: "on"
    - condition: template
      value_template: >
        {% set entity_id = trigger.event.data.entity_id %}
        {% set domain = entity_id.split('.')[0] if '.' in entity_id else '' %}
        {% set new_state = trigger.event.data.new_state %}
        {% set old_state = trigger.event.data.old_state %}
        {% set allowed_domains = ['binary_sensor', 'button', 'climate', 'cover', 'device_tracker', 'fan', 'light', 'lock', 'media_player', 'number', 'person', 'remote', 'select', 'sensor', 'switch', 'update', 'vacuum'] %}
        {{ new_state is not none and old_state is not none and domain in allowed_domains and old_state.state != 'unavailable' and new_state.state == 'unavailable' }}
  actions:
    - variables:
        entity_id: "{{ trigger.event.data.entity_id }}"
        entity_name: >
          {{ trigger.event.data.new_state.name if trigger.event.data.new_state is not none else trigger.event.data.entity_id }}
    - delay: "00:10:00"
    - condition: template
      value_template: "{{ states(entity_id) == 'unavailable' }}"
    - action: notify.mobile_app_leos_iphone
      data:
        title: "Device Health: Unavailable"
        message: "{{ entity_name }} ({{ entity_id }}) has been unavailable for 10+ minutes."
        data:
          tag: "device_health_unavailable_{{ entity_id | replace('.', '_') }}"
  mode: parallel
  max: 50

# -----------------------------------------------------------------------------
# Staircase Transitional Light
# Toggle: input_boolean.staircase_transitional_light (default: off)
# -----------------------------------------------------------------------------
- id: staircase_transitional_light
  alias: Staircase Transitional Light
  description: Turn on staircase light briefly when transitioning between floors
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.s1_pro_multi_sense_98a998_any_presence
        - binary_sensor.s1_pro_multi_sense_614680_any_presence
        - binary_sensor.s1_pro_multi_sense_96e7b0_any_presence
        - binary_sensor.s1_pro_multi_sense_98a968_any_presence
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.staircase_transitional_light
      state: "on"
    - condition: template
      value_template: >
        {% set offset = states('input_number.sunset_offset') | int %}
        {% set elevation_threshold = offset * 0.25 %}
        {{ state_attr('sun.sun', 'elevation') | float < elevation_threshold }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.staircase
      data:
        brightness_pct: "{{ states('sensor.auto_brightness_medium') | int }}"
        kelvin: "{{ states('sensor.auto_kelvin_medium') | int }}"
    - delay:
        minutes: 5
    - action: light.turn_off
      target:
        entity_id: light.staircase
      data:
        transition: 3
  mode: restart

# -----------------------------------------------------------------------------
# Office Ceiling Evening Dimming
# Dims the office ceiling light twice as fast as other office lights
# Toggle: input_boolean.office_auto_lights (uses same toggle as office auto lights)
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Prenatal Vitamin Reminder
# Sends notification to all users at 11:00, 12:00, 19:00, and 20:00
# Toggle: input_boolean.prenatal_vitamin_reminder (default: off)
# -----------------------------------------------------------------------------
- id: prenatal_vitamin_reminder
  alias: Prenatal Vitamin Reminder
  description: Daily reminders to take prenatal vitamins
  triggers:
    - trigger: time
      at: input_datetime.prenatal_vitamin_time_1
    - trigger: time
      at: input_datetime.prenatal_vitamin_time_2
    - trigger: time
      at: input_datetime.prenatal_vitamin_time_3
    - trigger: time
      at: input_datetime.prenatal_vitamin_time_4
  conditions:
    - condition: state
      entity_id: input_boolean.prenatal_vitamin_reminder
      state: "on"
  actions:
    - action: notify.notify
      data:
        title: "Prenatal Vitamins"
        message: "Time to take your prenatal vitamins!"
        data:
          tag: prenatal_vitamin_reminder
  mode: single

- id: office_ceiling_evening_dimming
  alias: Office Ceiling Evening Dimming
  description: Dim office ceiling twice as fast as other office lights in the evening
  triggers:
    - trigger: state
      entity_id: sensor.auto_brightness_medium
  conditions:
    - condition: state
      entity_id: input_boolean.office_auto_lights
      state: "on"
    - condition: state
      entity_id: light.officeceiling
      state: "on"
    - condition: time
      after: "17:00:00"
    - condition: template
      value_template: >
        {{ now().strftime('%H:%M:%S') < states('input_datetime.bedtime_start') }}
  actions:
    - action: light.turn_on
      target:
        entity_id: light.officeceiling
      data:
        brightness_pct: "{{ states('sensor.auto_brightness_medium') | int }}"
        kelvin: "{{ states('sensor.auto_kelvin_low') | int }}"
        transition: 60
  mode: single

# -----------------------------------------------------------------------------
# Bedtime Reminders
# Toggle: input_boolean.bedtime_reminders (default: on)
# Times: input_datetime.bedtime_reminder_early (default: 21:00)
#        input_datetime.bedtime_reminder_late (default: 21:30)
# -----------------------------------------------------------------------------
- id: bedtime_reminder_early
  alias: "Bedtime Reminder - Almost Bedtime"
  description: Sends a reminder to all users that bedtime is approaching
  triggers:
    - trigger: time
      at: input_datetime.bedtime_reminder_early
  conditions:
    - condition: state
      entity_id: input_boolean.bedtime_reminders
      state: "on"
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  actions:
    - action: notify.notify
      data:
        title: "Almost Bedtime"
        message: "Bedtime is coming up soon."
  mode: single

- id: bedtime_reminder_late
  alias: "Bedtime Reminder - Prepare for Bed"
  description: Sends a reminder to all users to prepare for bed
  triggers:
    - trigger: time
      at: input_datetime.bedtime_reminder_late
  conditions:
    - condition: state
      entity_id: input_boolean.bedtime_reminders
      state: "on"
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  actions:
    - action: notify.notify
      data:
        title: "Prepare for Bed"
        message: "Time to start winding down and prepare for bed."
  mode: single

# -----------------------------------------------------------------------------
# BILRESA Button Automations
# -----------------------------------------------------------------------------
- id: bilresa_red_toggle_red_lights
  alias: "BILRESA Red: Toggle Red Lights"
  description: Toggle bedroom, office and palace lights to red on button press
  triggers:
    - trigger: state
      entity_id: event.bilresa_scroll_wheel_button_3_2
  conditions:
    - condition: state
      entity_id: input_boolean.bilresa_red_toggle_red_lights
      state: "on"
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('light.bedroom', 'on') or is_state('light.palace', 'on') or is_state('light.staircase', 'on') }}
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.bedroom
                  - light.palace
                  - light.staircase
      default:
        - action: light.turn_on
          target:
            entity_id:
              - light.bedroom
              - light.palace
              - light.staircase
          data:
            hs_color: [0, 100]
            brightness_pct: 50
  mode: single

- id: bilresa_red_brightness_up
  alias: "BILRESA Red: Brightness Up"
  description: Increase brightness of bedroom, palace and staircase lights
  triggers:
    - trigger: state
      entity_id: event.bilresa_scroll_wheel_button_1_2
  conditions:
    - condition: state
      entity_id: input_boolean.bilresa_red_brightness_controls
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id:
          - light.bedroom
          - light.palace
          - light.staircase
      data:
        brightness_step_pct: 5
  mode: single

- id: bilresa_red_brightness_down
  alias: "BILRESA Red: Brightness Down"
  description: Decrease brightness of bedroom, palace and staircase lights
  triggers:
    - trigger: state
      entity_id: event.bilresa_scroll_wheel_button_2_2
  conditions:
    - condition: state
      entity_id: input_boolean.bilresa_red_brightness_controls
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id:
          - light.bedroom
          - light.palace
          - light.staircase
      data:
        brightness_step_pct: -5
  mode: single

# =============================================================================
# Baby Monitoring
# =============================================================================

- id: baby_sleep_start_record
  alias: "Baby: Record Sleep Start Time"
  trigger:
    - platform: state
      entity_id: input_boolean.baby_sleeping
      to: "on"
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.baby_sleep_start
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

- id: baby_counter_reset
  alias: "Baby: Reset Daily Counters at Midnight"
  trigger:
    - platform: time
      at: "00:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.baby_counter_reset
      state: "on"
  action:
    - service: counter.reset
      target:
        entity_id:
          - counter.feeding_count
          - counter.diaper_count
  mode: single
