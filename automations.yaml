          - cover.rs100_solar_io_bedroom_low_speed
          - cover.rs100_solar_io_office_low_speed
          - cover.rs100_solar_io_attic_low_speed
      data:
        position: >
          {% if is_state('binary_sensor.west_side_sunny', 'on') %}
            {{ states('input_number.blinds_west_sunny_position') | int }}
