- id: adaptive_lighting_morning
  alias: Adaptive Lighting - Morning Warm Up
  description: Gradually increase brightness and color temperature in the morning
  triggers:
    - trigger: time
      at: 06:00:00
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 30
        kelvin: 2700
    - delay: 00:30:00
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 70
        kelvin: 4000
  mode: single
- id: adaptive_lighting_evening
  alias: Adaptive Lighting - Evening Wind Down
  description: Dim lights and warm color temperature in the evening
  triggers:
    - trigger: time
      at: "20:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 50
        kelvin: 2700
        transition: 1800
  mode: single
- id: adaptive_lighting_night
  alias: Adaptive Lighting - Night Mode
  description: Very dim warm lights at night
  triggers:
    - trigger: time
      at: "22:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 20
        kelvin: 2200
        transition: 900
  mode: single
- id: room_occupancy_living_room_off
  alias: Room Occupancy - Living Room Off
  description: Turn off living room devices when unoccupied
  triggers:
    - trigger: state
      entity_id: binary_sensor.living_room_presence
      to: "off"
      for:
        minutes: 10
  conditions: []
  actions:
    - action: light.turn_off
      target:
        area_id: living_room
      data:
        transition: 5
    - action: media_player.turn_off
      target:
        area_id: living_room
  mode: single
- id: room_occupancy_bathroom_off
  alias: Room Occupancy - Bathroom Off
  description: Turn off bathroom lights and fan when unoccupied
  triggers:
    - trigger: state
      entity_id: binary_sensor.bathroom_presence
      to: "off"
      for:
        minutes: 5
  conditions: []
  actions:
    - action: light.turn_off
      target:
        area_id: bathroom
    - action: fan.turn_off
      target:
        area_id: bathroom
  mode: single
- id: morning_routine
  alias: Morning Routine
  description: Gradual wake up routine with lights and optional notifications
  triggers:
    - trigger: time
      at: 06:30:00
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
  actions:
    - action: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness_pct: 10
        kelvin: 2700
    - delay: 00:05:00
    - action: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness_pct: 30
        kelvin: 3500
        transition: 300
    - delay: 00:10:00
    - action: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness_pct: 70
        kelvin: 5000
        transition: 300
    - action: notify.mobile_app_your_phone
      data:
        title: Good Morning!
        message: Time to start your day
  mode: single
- id: morning_routine_weekend
  alias: Morning Routine - Weekend
  description: Later and gentler wake up on weekends
  triggers:
    - trigger: time
      at: 08:00:00
  conditions:
    - condition: time
      weekday:
        - sat
        - sun
  actions:
    - action: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness_pct: 20
        kelvin: 3000
        transition: 600
  mode: single
- id: bedtime_routine
  alias: Bedtime Routine
  description: Prepare the house for sleep
  triggers:
    - trigger: time
      at: "23:00:00"
  conditions: []
  actions:
    - action: light.turn_off
      target:
        entity_id: all
      data:
        transition: 10
    - action: lock.lock
      target:
        entity_id: lock.front_door
    - action: cover.close_cover
      target:
        entity_id: cover.garage_door
    - action: climate.set_temperature
      target:
        entity_id: climate.thermostat
      data:
        temperature: 19
    - action: notify.mobile_app_your_phone
      data:
        title: Goodnight
        message: House secured - all doors locked, lights off
  mode: single
- id: bedtime_routine_manual
  alias: Bedtime Routine - Manual Trigger
  description: Trigger bedtime routine manually via input_boolean
  triggers:
    - trigger: state
      entity_id: input_boolean.bedtime_mode
      to: "on"
  conditions: []
  actions:
    - action: light.turn_off
      target:
        entity_id: all
      data:
        transition: 5
    - action: lock.lock
      target:
        entity_id: lock.front_door
    - delay: 00:00:05
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.bedtime_mode
  mode: single
- id: laundry_washer_done
  alias: Laundry - Washer Finished
  description: Notify when washing machine cycle completes (power drops)
  triggers:
    - trigger: numeric_state
      entity_id: sensor.washer_power
      below: 5
      for:
        minutes: 3
  conditions:
    - condition: numeric_state
      entity_id: sensor.washer_power
      above: 0
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Laundry Done!
        message: The washing machine has finished. Don't forget to move clothes to dryer!
        data:
          tag: laundry_washer
          priority: high
  mode: single
- id: laundry_dryer_done
  alias: Laundry - Dryer Finished
  description: Notify when dryer cycle completes (power drops)
  triggers:
    - trigger: numeric_state
      entity_id: sensor.dryer_power
      below: 5
      for:
        minutes: 3
  conditions:
    - condition: numeric_state
      entity_id: sensor.dryer_power
      above: 0
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Dryer Done!
        message: The dryer has finished. Time to fold!
        data:
          tag: laundry_dryer
          priority: high
  mode: single
- id: laundry_reminder
  alias: Laundry - Reminder if not moved
  description: Remind again if washer finished but clothes not moved
  triggers:
    - trigger: state
      entity_id: sensor.washer_power
      to: "0"
      for:
        minutes: 30
  conditions: []
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Laundry Reminder
        message: Clothes are still in the washer! They might start to smell.
        data:
          tag: laundry_reminder
          priority: high
  mode: single
- id: low_battery_alert
  alias: Low Battery Alert
  description: Alert when any device battery drops below 20%
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.front_door_sensor_battery
        - sensor.motion_sensor_battery
        - sensor.window_sensor_battery
      below: 20
  conditions: []
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Low Battery Warning
        message:
          "{{ trigger.to_state.attributes.friendly_name }} battery is at {{ trigger.to_state.state
          }}%"
        data:
          tag: battery_{{ trigger.entity_id }}
          priority: default
  mode: parallel
  max: 10
- id: critical_battery_alert
  alias: Critical Battery Alert
  description: Urgent alert when any device battery drops below 10%
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.front_door_sensor_battery
        - sensor.motion_sensor_battery
        - sensor.window_sensor_battery
      below: 10
  conditions: []
  actions:
    - action: notify.mobile_app_leos_iphone
      data: {}
    - action: persistent_notification.create
      data:
        title: Critical Battery
        message: "{{ trigger.to_state.attributes.friendly_name }} needs battery replacement"
        notification_id: battery_{{ trigger.entity_id }}
  mode: parallel
  max: 10
