# Daily vacuum - run vacuum when nobody is home
- id: daily_vacuum_when_away
  alias: Daily Vacuum When Away
  description: Start vacuum cleaning when everyone leaves and it hasn't cleaned today
  initial_state: false
  triggers:
    - trigger: state
      entity_id: zone.home
      to: "0"
      for:
        minutes: 10
  conditions:
    - condition: time
      after: "09:00:00"
      before: "18:00:00"
    - condition: template
      value_template: >
        {{ (as_timestamp(now()) - as_timestamp(states('sensor.z60_ultra_roller_complete_last_clean_begin') | default(0))) > 86400 }}
  actions:
    - action: vacuum.start
      target:
        entity_id: vacuum.z60_ultra_roller_complete
  mode: single

# Vacuum error notification
- id: vacuum_error_notification
  alias: Vacuum Error Notification
  description: Notify when vacuum encounters an error
  initial_state: false
  triggers:
    - trigger: template
      value_template: "{{ states('sensor.z60_ultra_roller_complete_error') != 'no_error' }}"
    - trigger: template
      value_template: "{{ states('sensor.roborock_s7_maxv_vacuum_error') != 'none' }}"
  conditions: []
  actions:
    - action: notify.mobile_app_leos_iphone
      data:
        title: Vacuum Error
        message: >
          {% if states('sensor.z60_ultra_roller_complete_error') != 'no_error' %}
          Truus: {{ states('sensor.z60_ultra_roller_complete_error') }}
          {% else %}
          Roborock: {{ states('sensor.roborock_s7_maxv_vacuum_error') }}
          {% endif %}
        data:
          tag: vacuum_error
  mode: single

# TV movie mode - dim lights when TV starts playing
- id: tv_movie_mode
  alias: TV Movie Mode
  description: Dim living room lights when TV starts playing
  initial_state: false
  triggers:
    - trigger: state
      entity_id: media_player.livingroom_tv
      to: playing
  conditions:
    - condition: state
      entity_id: light.living_room
      state: "on"
    - condition: sun
      after: sunset
      before: sunrise
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 15
        kelvin: 2200
        transition: 3
  mode: single

# TV pause - brighten lights when TV pauses
- id: tv_pause_brighten
  alias: TV Pause - Brighten Lights
  description: Brighten living room lights when TV pauses or stops
  initial_state: false
  triggers:
    - trigger: state
      entity_id: media_player.livingroom_tv
      from: playing
      to:
        - paused
        - idle
        - "off"
  conditions:
    - condition: state
      entity_id: light.living_room
      state: "on"
    - condition: sun
      after: sunset
      before: sunrise
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 60
        kelvin: 3000
        transition: 2
  mode: single

