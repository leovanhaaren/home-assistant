blueprint:
  name: Presence Auto Lights
  description: >
    Turn on lights when presence is detected after sunset, turn off when no presence.
    Uses time-aware brightness and respects a toggle input_boolean.
    Includes a countdown timer for dashboard display.
  domain: automation
  author: Leo
  input:
    presence_sensor:
      name: Presence Sensor
      description: The presence sensor to monitor
      selector:
        entity:
          filter:
            domain: binary_sensor
    light_target:
      name: Light
      description: The light(s) to control
      selector:
        target:
          entity:
            domain: light
    toggle_entity:
      name: Toggle
      description: Input boolean to enable/disable this automation
      selector:
        entity:
          filter:
            domain: input_boolean
    countdown_timer:
      name: Countdown Timer
      description: Timer entity to track the countdown before lights turn off
      selector:
        entity:
          filter:
            domain: timer
    no_presence_wait:
      name: No presence wait time
      description: Time to wait after no presence before turning off lights
      default: 1
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: minutes
    turn_on_transition:
      name: Turn on transition
      description: Transition time when turning on lights
      default: 1
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: seconds
    turn_off_transition:
      name: Turn off transition
      description: Transition time when turning off lights
      default: 3
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: seconds
    max_brightness:
      name: Maximum brightness
      description: Maximum brightness percentage (0 = no limit, use time-aware brightness)
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    min_brightness:
      name: Minimum brightness
      description: Minimum brightness percentage (0 = no minimum)
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    color_temp:
      name: Color temperature
      description: Color temperature in Kelvin (0 = don't set)
      default: 0
      selector:
        number:
          min: 0
          max: 6500
          unit_of_measurement: K
    time_limit_before:
      name: Time limit (before)
      description: >
        Only turn on lights before this time.
        Accepts a static time (e.g. "22:00:00") or an input_datetime entity ID.
      default: "23:59:59"
      selector:
        text:
    time_limit_after:
      name: Time limit (after)
      description: >
        Only turn on lights after this time.
        Accepts a static time (e.g. "07:00:00") or an input_datetime entity ID.
      default: "00:00:00"
      selector:
        text:
    ignore_sun:
      name: Ignore sun elevation
      description: Always turn on lights regardless of sun position (useful for windowless rooms like toilets)
      default: false
      selector:
        boolean:

variables:
  max_brightness_var: !input max_brightness
  min_brightness_var: !input min_brightness
  color_temp_var: !input color_temp
  time_limit_before_raw: !input time_limit_before
  time_limit_after_raw: !input time_limit_after
  time_limit_var: >
    {{ states(time_limit_before_raw) if time_limit_before_raw.startswith('input_datetime.') else time_limit_before_raw }}
  time_limit_after_var: >
    {{ states(time_limit_after_raw) if time_limit_after_raw.startswith('input_datetime.') else time_limit_after_raw }}
  no_presence_wait_var: !input no_presence_wait
  ignore_sun_var: !input ignore_sun

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input presence_sensor
    to: "on"
    id: presence_on
  - trigger: state
    entity_id: !input presence_sensor
    to: "off"
    id: presence_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input countdown_timer
    id: timer_finished

conditions:
  - condition: state
    entity_id: !input toggle_entity
    state: "on"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: presence_on
          - condition: template
            value_template: >
              {% if ignore_sun_var %}
                true
              {% else %}
                {% set offset = states('input_number.sunset_offset') | int %}
                {% set elevation_threshold = offset * 0.25 %}
                {{ state_attr('sun.sun', 'elevation') | float < elevation_threshold }}
              {% endif %}
          - condition: template
            value_template: >
              {% set current = now().strftime('%H:%M:%S') %}
              {% set t_after = time_limit_after_var | trim %}
              {% set t_before = time_limit_var | trim %}
              {{ current >= t_after and current < t_before }}
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input countdown_timer
          - action: light.turn_on
            target: !input light_target
            data:
              brightness_pct: >
                {% set time_bright = states('sensor.auto_brightness_high') | int(0) %}
                {% set max_b = max_brightness_var | int(0) %}
                {% set min_b = min_brightness_var | int(0) %}
                {% set capped = [time_bright, max_b] | min if max_b > 0 else time_bright %}
                {% if min_b > 0 %}
                  {% set floor = [min_b, max_b] | min if max_b > 0 else min_b %}
                  {{ [capped, floor] | max }}
                {% else %}
                  {{ capped }}
                {% endif %}
              transition: !input turn_on_transition
              color_temp_kelvin: >
                {{ color_temp_var if color_temp_var > 0 else states('sensor.auto_kelvin_medium') | int }}
      - conditions:
          - condition: trigger
            id: presence_off
        sequence:
          - action: timer.start
            target:
              entity_id: !input countdown_timer
            data:
              duration:
                minutes: "{{ no_presence_wait_var }}"
      - conditions:
          - condition: trigger
            id: timer_finished
          - condition: state
            entity_id: !input presence_sensor
            state: "off"
        sequence:
          - action: light.turn_off
            target: !input light_target
            data:
              transition: !input turn_off_transition
