      # Palace (98a968)
      - name: "Palace CO2"
        unique_id: palace_co2
        unit_of_measurement: "ppm"
        device_class: carbon_dioxide
        state: "{{ states('sensor.s1_pro_multi_sense_98a968_scd40_co2_concentration') | round(0) }}"
