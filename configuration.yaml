# Loads default set of integrations. Do not remove.
default_config:

# Automation enable/disable toggles
input_boolean: !include automation_toggles.yaml

# Sun offset helpers for automations (in minutes, negative = before, positive = after)
input_number:
  sunrise_offset:
    name: Sunrise Offset
    icon: mdi:weather-sunset-up
    min: -120
    max: 120
    step: 5
    unit_of_measurement: min
    mode: slider
  sunset_offset:
    name: Sunset Offset
    icon: mdi:weather-sunset-down
    min: -120
    max: 120
    step: 5
    unit_of_measurement: min
    mode: slider

# Input datetime helpers to track when users arrive home
input_datetime:
  leo_arrived_home:
    name: Leo Arrived Home
    has_date: true
    has_time: true
  kardi_arrived_home:
    name: Kardi Arrived Home
    has_date: true
    has_time: true

# Template sensors to show presence duration and time-aware brightness
template:
  - sensor:
      - name: "Next Sunrise"
        unique_id: next_sunrise_with_offset
        device_class: timestamp
        state: >
          {% set offset = states('input_number.sunrise_offset') | int %}
          {% set sunrise = state_attr('sun.sun', 'next_rising') | as_datetime %}
          {{ (sunrise + timedelta(minutes=offset)).isoformat() }}
        icon: mdi:weather-sunset-up
        attributes:
          offset_minutes: "{{ states('input_number.sunrise_offset') | int }}"
          base_time: "{{ state_attr('sun.sun', 'next_rising') }}"

      - name: "Next Sunset"
        unique_id: next_sunset_with_offset
        device_class: timestamp
        state: >
          {% set offset = states('input_number.sunset_offset') | int %}
          {% set sunset = state_attr('sun.sun', 'next_setting') | as_datetime %}
          {{ (sunset + timedelta(minutes=offset)).isoformat() }}
        icon: mdi:weather-sunset-down
        attributes:
          offset_minutes: "{{ states('input_number.sunset_offset') | int }}"
          base_time: "{{ state_attr('sun.sun', 'next_setting') }}"

      - name: "Time Aware Brightness"
        unique_id: time_aware_brightness
        unit_of_measurement: "%"
        state: >
          {% set hour = now().hour %}
          {% set minute = now().minute %}
          {% set time_decimal = hour + (minute / 60) %}
          {# Brightness curve:
             06:00-17:00: 100% (daytime, though lights usually off due to sun)
             17:00-19:00: 90-100% (early evening, brightest)
             19:00-21:00: 70-90% (evening wind-down starts)
             21:00-22:00: 50-70% (late evening)
             22:00-23:00: 30-50% (pre-bedtime)
             23:00-06:00: 15-30% (night mode)
          #}
          {% if 6 <= time_decimal < 17 %}
            100
          {% elif 17 <= time_decimal < 19 %}
            {{ (100 - ((time_decimal - 17) * 5)) | round(0) }}
          {% elif 19 <= time_decimal < 21 %}
            {{ (90 - ((time_decimal - 19) * 10)) | round(0) }}
          {% elif 21 <= time_decimal < 22 %}
            {{ (70 - ((time_decimal - 21) * 20)) | round(0) }}
          {% elif 22 <= time_decimal < 23 %}
            {{ (50 - ((time_decimal - 22) * 20)) | round(0) }}
          {% else %}
            {# 23:00-06:00 night mode #}
            {% if time_decimal >= 23 %}
              {{ (30 - ((time_decimal - 23) * 15)) | round(0) | max(15) }}
            {% else %}
              15
            {% endif %}
          {% endif %}
        icon: mdi:brightness-auto
        attributes:
          period: >
            {% set hour = now().hour %}
            {% if 6 <= hour < 17 %}
              Daytime
            {% elif 17 <= hour < 19 %}
              Early Evening
            {% elif 19 <= hour < 21 %}
              Evening
            {% elif 21 <= hour < 22 %}
              Late Evening
            {% elif 22 <= hour < 23 %}
              Pre-Bedtime
            {% else %}
              Night
            {% endif %}

      - name: "Leo Presence Duration"
        unique_id: leo_presence_duration
        state: >
          {% if is_state('person.leo', 'home') %}
            {% set arrived = states('input_datetime.leo_arrived_home') %}
            {% if arrived not in ['unknown', 'unavailable', ''] %}
              {% set arrival_time = as_datetime(arrived) | as_local %}
              {% if arrival_time %}
                {% set duration = now() - arrival_time %}
                {% set hours = (duration.total_seconds() // 3600) | int %}
                {% set minutes = ((duration.total_seconds() % 3600) // 60) | int %}
                {% if hours > 0 %}
                  {{ hours }}h {{ minutes }}m
                {% else %}
                  {{ minutes }}m
                {% endif %}
              {% else %}
                Unknown
              {% endif %}
            {% else %}
              Just arrived
            {% endif %}
          {% else %}
            Away
          {% endif %}
        icon: mdi:home-clock
        attributes:
          arrival_time: "{{ states('input_datetime.leo_arrived_home') }}"
          total_minutes: >
            {% if is_state('person.leo', 'home') %}
              {% set arrived = states('input_datetime.leo_arrived_home') %}
              {% if arrived not in ['unknown', 'unavailable', ''] %}
                {% set arrival_time = as_datetime(arrived) | as_local %}
                {% if arrival_time %}
                  {{ ((now() - arrival_time).total_seconds() / 60) | int }}
                {% else %}
                  0
                {% endif %}
              {% else %}
                0
              {% endif %}
            {% else %}
              0
            {% endif %}

      - name: "Kardi Presence Duration"
        unique_id: kardi_presence_duration
        state: >
          {% if is_state('person.kardi', 'home') %}
            {% set arrived = states('input_datetime.kardi_arrived_home') %}
            {% if arrived not in ['unknown', 'unavailable', ''] %}
              {% set arrival_time = as_datetime(arrived) | as_local %}
              {% if arrival_time %}
                {% set duration = now() - arrival_time %}
                {% set hours = (duration.total_seconds() // 3600) | int %}
                {% set minutes = ((duration.total_seconds() % 3600) // 60) | int %}
                {% if hours > 0 %}
                  {{ hours }}h {{ minutes }}m
                {% else %}
                  {{ minutes }}m
                {% endif %}
              {% else %}
                Unknown
              {% endif %}
            {% else %}
              Just arrived
            {% endif %}
          {% else %}
            Away
          {% endif %}
        icon: mdi:home-clock
        attributes:
          arrival_time: "{{ states('input_datetime.kardi_arrived_home') }}"
          total_minutes: >
            {% if is_state('person.kardi', 'home') %}
              {% set arrived = states('input_datetime.kardi_arrived_home') %}
              {% if arrived not in ['unknown', 'unavailable', ''] %}
                {% set arrival_time = as_datetime(arrived) | as_local %}
                {% if arrival_time %}
                  {{ ((now() - arrival_time).total_seconds() / 60) | int }}
                {% else %}
                  0
                {% endif %}
              {% else %}
                0
              {% endif %}
            {% else %}
              0
            {% endif %}

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
