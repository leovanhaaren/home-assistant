# Loads default set of integrations. Do not remove.
default_config:

recorder:
  exclude:
    entities:
      - sensor.leo_presence_duration
      - sensor.kardi_presence_duration

# Automation enable/disable toggles
input_boolean: !include automation_toggles.yaml

# Timers for presence auto lights countdown
timer:
  kitchen_light_off:
    name: Kitchen Light Off Timer
    icon: mdi:timer-outline
  office_light_off:
    name: Office Light Off Timer
    icon: mdi:timer-outline
  palace_light_off:
    name: Palace Light Off Timer
    icon: mdi:timer-outline
  bedroom_light_off:
    name: Bedroom Light Off Timer
    icon: mdi:timer-outline
  toilet_light_off:
    name: Toilet Light Off Timer
    icon: mdi:timer-outline

# Sun offset helpers for automations (in minutes, negative = before, positive = after)
input_number:
  sunrise_offset:
    name: Sunrise Offset
    icon: mdi:weather-sunset-up
    min: -120
    max: 120
    step: 5
    unit_of_measurement: min
    mode: slider
  sunset_offset:
    name: Sunset Offset
    icon: mdi:weather-sunset-down
    min: -120
    max: 120
    step: 5
    unit_of_measurement: min
    mode: slider
  evening_blinds_bedroom_position:
    name: Bedroom Closing Position
    icon: mdi:blinds
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider

# Input datetime helpers to track when users arrive home
input_datetime:
  leo_arrived_home:
    name: Leo Arrived Home
    has_date: true
    has_time: true
  kardi_arrived_home:
    name: Kardi Arrived Home
    has_date: true
    has_time: true
  morning_blinds_open_time:
    name: Morning Blinds Open Time
    has_date: false
    has_time: true
  weekend_blinds_open_time:
    name: Weekend Blinds Open Time
    has_date: false
    has_time: true
  evening_blinds_close_time:
    name: Evening Blinds Close Time
    has_date: false
    has_time: true
  prenatal_vitamin_time_1:
    name: Prenatal Vitamin Time 1
    has_date: false
    has_time: true
  prenatal_vitamin_time_2:
    name: Prenatal Vitamin Time 2
    has_date: false
    has_time: true
  prenatal_vitamin_time_3:
    name: Prenatal Vitamin Time 3
    has_date: false
    has_time: true
  prenatal_vitamin_time_4:
    name: Prenatal Vitamin Time 4
    has_date: false
    has_time: true
  bedtime_start:
    name: Bedtime Start
    has_date: false
    has_time: true
  bedtime_end:
    name: Bedtime End
    has_date: false
    has_time: true
  bedtime_reminder_early:
    name: Bedtime Reminder (Early)
    has_date: false
    has_time: true
  bedtime_reminder_late:
    name: Bedtime Reminder (Late)
    has_date: false
    has_time: true

# Template sensors to show presence duration and time-aware brightness
template:
  - sensor:
      - name: "Next Sunrise"
        unique_id: next_sunrise_with_offset
        device_class: timestamp
        state: >
          {% set offset = states('input_number.sunrise_offset') | int %}
          {% set sunrise = state_attr('sun.sun', 'next_rising') | as_datetime %}
          {{ (sunrise + timedelta(minutes=offset)).isoformat() }}
        icon: mdi:weather-sunset-up
        attributes:
          offset_minutes: "{{ states('input_number.sunrise_offset') | int }}"
          base_time: "{{ state_attr('sun.sun', 'next_rising') }}"

      - name: "Next Sunset"
        unique_id: next_sunset_with_offset
        device_class: timestamp
        state: >
          {% set offset = states('input_number.sunset_offset') | int %}
          {% set sunset = state_attr('sun.sun', 'next_setting') | as_datetime %}
          {{ (sunset + timedelta(minutes=offset)).isoformat() }}
        icon: mdi:weather-sunset-down
        attributes:
          offset_minutes: "{{ states('input_number.sunset_offset') | int }}"
          base_time: "{{ state_attr('sun.sun', 'next_setting') }}"

      - name: "Auto Brightness High"
        unique_id: auto_brightness_high
        unit_of_measurement: "%"
        state: >
          {% set hour = now().hour %}
          {% set minute = now().minute %}
          {% set time_decimal = hour + (minute / 60) %}
          {# High brightness curve: 80 down to 25
             06:00-17:00: 80% (daytime max)
             17:00-19:00: 71-80% (early evening)
             19:00-21:00: 48-71% (evening wind-down)
             21:00-22:00: 36-48% (late evening)
             22:00-23:00: 25-36% (pre-bedtime)
             23:00-06:00: 25% (night mode)
          #}
          {% set max_val = 80 %}
          {% set min_val = 25 %}
          {% set range = max_val - min_val %}
          {% if 6 <= time_decimal < 17 %}
            {{ max_val }}
          {% elif 17 <= time_decimal < 19 %}
            {{ (max_val - ((time_decimal - 17) * (range * 0.16 / 2))) | round(0) }}
          {% elif 19 <= time_decimal < 21 %}
            {{ (max_val - (range * 0.16) - ((time_decimal - 19) * (range * 0.21 / 2))) | round(0) }}
          {% elif 21 <= time_decimal < 22 %}
            {{ (max_val - (range * 0.58) - ((time_decimal - 21) * (range * 0.22))) | round(0) }}
          {% elif 22 <= time_decimal < 23 %}
            {{ (max_val - (range * 0.80) - ((time_decimal - 22) * (range * 0.20))) | round(0) | max(min_val) }}
          {% else %}
            {{ min_val }}
          {% endif %}
        icon: mdi:brightness-7
        attributes:
          period: >
            {% set hour = now().hour %}
            {% if 6 <= hour < 17 %}
              Daytime
            {% elif 17 <= hour < 19 %}
              Early Evening
            {% elif 19 <= hour < 21 %}
              Evening
            {% elif 21 <= hour < 22 %}
              Late Evening
            {% elif 22 <= hour < 23 %}
              Pre-Bedtime
            {% else %}
              Night
            {% endif %}

      - name: "Auto Brightness Medium"
        unique_id: auto_brightness_medium
        unit_of_measurement: "%"
        state: >
          {% set hour = now().hour %}
          {% set minute = now().minute %}
          {% set time_decimal = hour + (minute / 60) %}
          {# Medium brightness curve: 60 down to 20
             06:00-17:00: 60% (daytime max)
             17:00-19:00: 54-60% (early evening)
             19:00-21:00: 37-54% (evening wind-down)
             21:00-22:00: 28-37% (late evening)
             22:00-23:00: 20-28% (pre-bedtime)
             23:00-06:00: 20% (night mode)
          #}
          {% set max_val = 60 %}
          {% set min_val = 20 %}
          {% set range = max_val - min_val %}
          {% if 6 <= time_decimal < 17 %}
            {{ max_val }}
          {% elif 17 <= time_decimal < 19 %}
            {{ (max_val - ((time_decimal - 17) * (range * 0.16 / 2))) | round(0) }}
          {% elif 19 <= time_decimal < 21 %}
            {{ (max_val - (range * 0.16) - ((time_decimal - 19) * (range * 0.21 / 2))) | round(0) }}
          {% elif 21 <= time_decimal < 22 %}
            {{ (max_val - (range * 0.58) - ((time_decimal - 21) * (range * 0.22))) | round(0) }}
          {% elif 22 <= time_decimal < 23 %}
            {{ (max_val - (range * 0.80) - ((time_decimal - 22) * (range * 0.20))) | round(0) | max(min_val) }}
          {% else %}
            {{ min_val }}
          {% endif %}
        icon: mdi:brightness-6

      - name: "Auto Brightness Low"
        unique_id: auto_brightness_low
        unit_of_measurement: "%"
        state: >
          {% set hour = now().hour %}
          {% set minute = now().minute %}
          {% set time_decimal = hour + (minute / 60) %}
          {# Low brightness curve: 40 down to 15
             06:00-17:00: 40% (daytime max)
             17:00-19:00: 36-40% (early evening)
             19:00-21:00: 25-36% (evening wind-down)
             21:00-22:00: 19-25% (late evening)
             22:00-23:00: 15-19% (pre-bedtime)
             23:00-06:00: 15% (night mode)
          #}
          {% set max_val = 40 %}
          {% set min_val = 15 %}
          {% set range = max_val - min_val %}
          {% if 6 <= time_decimal < 17 %}
            {{ max_val }}
          {% elif 17 <= time_decimal < 19 %}
            {{ (max_val - ((time_decimal - 17) * (range * 0.16 / 2))) | round(0) }}
          {% elif 19 <= time_decimal < 21 %}
            {{ (max_val - (range * 0.16) - ((time_decimal - 19) * (range * 0.21 / 2))) | round(0) }}
          {% elif 21 <= time_decimal < 22 %}
            {{ (max_val - (range * 0.58) - ((time_decimal - 21) * (range * 0.22))) | round(0) }}
          {% elif 22 <= time_decimal < 23 %}
            {{ (max_val - (range * 0.80) - ((time_decimal - 22) * (range * 0.20))) | round(0) | max(min_val) }}
          {% else %}
            {{ min_val }}
          {% endif %}
        icon: mdi:brightness-5

      - name: "Auto Kelvin High"
        unique_id: auto_kelvin_high
        unit_of_measurement: "K"
        state: >
          {% set hour = now().hour %}
          {% set minute = now().minute %}
          {% set time_decimal = hour + (minute / 60) %}
          {# High kelvin curve: 4000K down to 2700K
             06:00-17:00: 4000K (daytime, cool white)
             17:00-19:00: 3792-4000K (early evening)
             19:00-21:00: 3519-3792K (evening wind-down)
             21:00-22:00: 3233-3519K (late evening)
             22:00-23:00: 2700-3233K (pre-bedtime)
             23:00-06:00: 2700K (night mode)
          #}
          {% set max_val = 4000 %}
          {% set min_val = 2700 %}
          {% set range = max_val - min_val %}
          {% if 6 <= time_decimal < 17 %}
            {{ max_val }}
          {% elif 17 <= time_decimal < 19 %}
            {{ (max_val - ((time_decimal - 17) * (range * 0.16 / 2))) | round(0) }}
          {% elif 19 <= time_decimal < 21 %}
            {{ (max_val - (range * 0.16) - ((time_decimal - 19) * (range * 0.21 / 2))) | round(0) }}
          {% elif 21 <= time_decimal < 22 %}
            {{ (max_val - (range * 0.58) - ((time_decimal - 21) * (range * 0.22))) | round(0) }}
          {% elif 22 <= time_decimal < 23 %}
            {{ (max_val - (range * 0.80) - ((time_decimal - 22) * (range * 0.20))) | round(0) | max(min_val) }}
          {% else %}
            {{ min_val }}
          {% endif %}
        icon: mdi:sun-thermometer

      - name: "Auto Kelvin Medium"
        unique_id: auto_kelvin_medium
        unit_of_measurement: "K"
        state: >
          {% set hour = now().hour %}
          {% set minute = now().minute %}
          {% set time_decimal = hour + (minute / 60) %}
          {# Medium kelvin curve: 3500K down to 2500K
             06:00-17:00: 3500K (daytime, warm neutral)
             17:00-19:00: 3340-3500K (early evening)
             19:00-21:00: 3130-3340K (evening wind-down)
             21:00-22:00: 2910-3130K (late evening)
             22:00-23:00: 2500-2910K (pre-bedtime)
             23:00-06:00: 2500K (night mode)
          #}
          {% set max_val = 3500 %}
          {% set min_val = 2500 %}
          {% set range = max_val - min_val %}
          {% if 6 <= time_decimal < 17 %}
            {{ max_val }}
          {% elif 17 <= time_decimal < 19 %}
            {{ (max_val - ((time_decimal - 17) * (range * 0.16 / 2))) | round(0) }}
          {% elif 19 <= time_decimal < 21 %}
            {{ (max_val - (range * 0.16) - ((time_decimal - 19) * (range * 0.21 / 2))) | round(0) }}
          {% elif 21 <= time_decimal < 22 %}
            {{ (max_val - (range * 0.58) - ((time_decimal - 21) * (range * 0.22))) | round(0) }}
          {% elif 22 <= time_decimal < 23 %}
            {{ (max_val - (range * 0.80) - ((time_decimal - 22) * (range * 0.20))) | round(0) | max(min_val) }}
          {% else %}
            {{ min_val }}
          {% endif %}
        icon: mdi:sun-thermometer-outline

      - name: "Auto Kelvin Low"
        unique_id: auto_kelvin_low
        unit_of_measurement: "K"
        state: >
          {% set hour = now().hour %}
          {% set minute = now().minute %}
          {% set time_decimal = hour + (minute / 60) %}
          {# Low kelvin curve: 3000K down to 2200K
             06:00-17:00: 3000K (daytime, warm)
             17:00-19:00: 2872-3000K (early evening)
             19:00-21:00: 2704-2872K (evening wind-down)
             21:00-22:00: 2528-2704K (late evening)
             22:00-23:00: 2200-2528K (pre-bedtime)
             23:00-06:00: 2200K (night mode)
          #}
          {% set max_val = 3000 %}
          {% set min_val = 2200 %}
          {% set range = max_val - min_val %}
          {% if 6 <= time_decimal < 17 %}
            {{ max_val }}
          {% elif 17 <= time_decimal < 19 %}
            {{ (max_val - ((time_decimal - 17) * (range * 0.16 / 2))) | round(0) }}
          {% elif 19 <= time_decimal < 21 %}
            {{ (max_val - (range * 0.16) - ((time_decimal - 19) * (range * 0.21 / 2))) | round(0) }}
          {% elif 21 <= time_decimal < 22 %}
            {{ (max_val - (range * 0.58) - ((time_decimal - 21) * (range * 0.22))) | round(0) }}
          {% elif 22 <= time_decimal < 23 %}
            {{ (max_val - (range * 0.80) - ((time_decimal - 22) * (range * 0.20))) | round(0) | max(min_val) }}
          {% else %}
            {{ min_val }}
          {% endif %}
        icon: mdi:thermometer

      - name: "Leo Presence Duration"
        unique_id: leo_presence_duration
        state: >
          {% if is_state('person.leo', 'home') %}
            {% set arrived = states('input_datetime.leo_arrived_home') %}
            {% if arrived not in ['unknown', 'unavailable', ''] %}
              {% set arrival_time = as_datetime(arrived) | as_local %}
              {% if arrival_time %}
                {% set duration = now() - arrival_time %}
                {% set hours = (duration.total_seconds() // 3600) | int %}
                {% set minutes = ((duration.total_seconds() % 3600) // 60) | int %}
                {% if hours > 0 %}
                  {{ hours }}h {{ minutes }}m
                {% else %}
                  {{ minutes }}m
                {% endif %}
              {% else %}
                Unknown
              {% endif %}
            {% else %}
              Just arrived
            {% endif %}
          {% else %}
            Away
          {% endif %}
        icon: mdi:home-clock
        attributes:
          arrival_time: "{{ states('input_datetime.leo_arrived_home') }}"
          total_minutes: >
            {% if is_state('person.leo', 'home') %}
              {% set arrived = states('input_datetime.leo_arrived_home') %}
              {% if arrived not in ['unknown', 'unavailable', ''] %}
                {% set arrival_time = as_datetime(arrived) | as_local %}
                {% if arrival_time %}
                  {{ ((now() - arrival_time).total_seconds() / 60) | int }}
                {% else %}
                  0
                {% endif %}
              {% else %}
                0
              {% endif %}
            {% else %}
              0
            {% endif %}

      - name: "Kardi Presence Duration"
