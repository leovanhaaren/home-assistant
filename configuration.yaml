            {% endif %}

      # Environment sensors - friendly names for S1 Pro Multi Sense devices
      # Bedroom (96e7b0)
      - name: "Bedroom CO2"
        unique_id: bedroom_co2
        unit_of_measurement: "ppm"
        device_class: carbon_dioxide
        state: "{{ states('sensor.s1_pro_multi_sense_96e7b0_scd40_co2_concentration') | round(0) }}"
        icon: mdi:molecule-co2

      - name: "Bedroom Temperature"
        unique_id: bedroom_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('sensor.s1_pro_multi_sense_96e7b0_scd40_temperature') | round(1) }}"
        icon: mdi:thermometer

      - name: "Bedroom Humidity"
        unique_id: bedroom_humidity
        unit_of_measurement: "%"
        device_class: humidity
        state: "{{ states('sensor.s1_pro_multi_sense_96e7b0_scd40_humidity') | round(0) }}"
