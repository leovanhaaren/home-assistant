# =============================================================================
# AUTOMATION TOGGLES
# =============================================================================
# Enable/disable automations from the Home Assistant UI
# Each toggle controls whether its corresponding automation runs
#
# Usage: Go to Settings > Devices & Services > Helpers to toggle these
#        Or add them to your Lovelace dashboard for quick access
# =============================================================================

# -----------------------------------------------------------------------------
# Kitchen Automations
# -----------------------------------------------------------------------------
kitchen_auto_lights:
  name: "Kitchen Auto Lights"
  icon: mdi:lightbulb-auto

# -----------------------------------------------------------------------------
# Office Automations
# -----------------------------------------------------------------------------
office_auto_lights:
  name: "Office Auto Lights"
  icon: mdi:desk-lamp

# -----------------------------------------------------------------------------
# Adaptive Lighting
# -----------------------------------------------------------------------------
adaptive_lighting:
  name: "Adaptive Lighting"
  icon: mdi:theme-light-dark

# -----------------------------------------------------------------------------
# Laundry Notifications
# -----------------------------------------------------------------------------
laundry_notifications:
  name: "Laundry Notifications"
  icon: mdi:washing-machine

# -----------------------------------------------------------------------------
# Welcome/Goodbye Automations
# -----------------------------------------------------------------------------
welcome_home_lights:
  name: "Welcome Home Lights"
  icon: mdi:home-import-outline
  initial: false

goodbye_all_off:
  name: "Goodbye - All Off"
  icon: mdi:home-export-outline
  initial: false

# -----------------------------------------------------------------------------
# Blinds Automations
# -----------------------------------------------------------------------------
morning_blinds:
  name: "Morning Blinds Open"
  icon: mdi:blinds-open
  initial: false

